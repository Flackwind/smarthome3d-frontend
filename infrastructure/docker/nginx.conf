server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http: https: ws: wss:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  gzip on;
  gzip_types text/css application/javascript application/json application/wasm image/svg+xml;
  location / { try_files $uri $uri/ /index.html; }
  location ~ \.mjs$ { default_type application/javascript; try_files $uri =404; }
  location ~ ^/(ngsw.*|index.html|manifest.webmanifest)$ { expires -1; try_files $uri =404; }
  location ~* \.(js|css|wasm|png|svg|json)$ { try_files $uri =404; }
}
